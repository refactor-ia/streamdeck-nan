name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 0 }

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@11.13.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and Stream Deck validation
        run: pnpm check:workspace

      - name: Run tests (workspace)
        run: pnpm test:workspace

      - name: Verify plugin bundle is tracked
        run: git ls-files --error-unmatch -- com.refactor-ia.nan.sdPlugin/bin/plugin.js

      - name: Build plugin bundle
        run: pnpm build

      - name: Verify bundle parity (rebuild == committed)
        run: |
          # Rebuild and check for diff. If different, the bundle wasn't committed.
          pnpm build
          if ! git diff --quiet -- com.refactor-ia.nan.sdPlugin/bin/plugin.js; then
            echo "::error::bundle rebuild produced a different bin/plugin.js. Run \`pnpm build\` and commit the result."
            exit 1
          fi
        shell: bash

      - name: Secret scan (pre-built binary)
        run: pnpm scan:secrets

      - name: Gitleaks scan
        uses: ./.github/actions/gitleaks

      - name: Verify release packaging contract
        run: |
          node scripts/release-contract.mjs "v$(node -p "require('./package.json').version")" versions
          node -e "require('node:fs').rmSync('dist', { recursive: true, force: true })"
          pnpm build:nan-keychain
          test -x com.refactor-ia.nan.sdPlugin/bin/nan-keychain
          pnpm release:pack:verify
          (cd dist && shasum -a 256 *.streamDeckPlugin > SHA256SUMS)
          node scripts/release-contract.mjs "v$(node -p "require('./package.json').version")" unsigned-ci

  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@11.13.0 --activate
      - run: pnpm check:links
      - name: Check release artifacts
        run: test -f LICENSE && test -f SECURITY.md && test -f com.refactor-ia.nan.sdPlugin/LICENSE
