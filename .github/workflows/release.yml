name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@11.13.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Validate release versions before packaging
        run: node scripts/release-contract.mjs "$GITHUB_REF_NAME" versions
      - run: pnpm check:workspace
      - run: pnpm test:workspace
      - name: Verify plugin bundle is tracked
        run: git ls-files --error-unmatch -- com.refactor-ia.nan.sdPlugin/bin/plugin.js
      - run: pnpm build
      - name: Build universal NaN Keychain helper
        run: pnpm build:nan-keychain
      - name: Verify universal NaN Keychain helper is executable
        run: test -x com.refactor-ia.nan.sdPlugin/bin/nan-keychain
      - run: pnpm scan:secrets
      - name: Gitleaks scan
        uses: ./.github/actions/gitleaks
      - name: Package immutable staged plugin
        run: pnpm release:pack:verify
      - name: Verify release bytes
        run: |
          (cd dist && shasum -a 256 *.streamDeckPlugin > SHA256SUMS)
          node scripts/release-contract.mjs "$GITHUB_REF_NAME"
          git diff --exit-code -- com.refactor-ia.nan.sdPlugin/manifest.json com.refactor-ia.nan.sdPlugin/bin/plugin.js
      - name: Upload verified release bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/*.streamDeckPlugin
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@11.13.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Download verified release bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ github.ref_name }}
          path: dist
      - name: Verify reviewed bytes before signing
        run: |
          (cd dist && shasum -a 256 -c SHA256SUMS)
          node scripts/release-contract.mjs "$GITHUB_REF_NAME"
      - run: pnpm build
      - name: Build and sign NaN Keychain helper
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
        run: |
          # hardened runtime (--options runtime); --timestamp=none keeps the build deterministic,
          # the notary service supplies the trusted timestamp at submission time.
          pnpm build:nan-keychain
          codesign -dv com.refactor-ia.nan.sdPlugin/bin/nan-keychain 2>&1 | grep -q 'flags=0x10000(runtime)'
          codesign -dv com.refactor-ia.nan.sdPlugin/bin/nan-keychain 2>&1 | grep -q 'Timestamp=none'
      - name: Package signed plugin
        run: pnpm release:pack
      - name: Verify signed release bytes
        run: |
          (cd dist && shasum -a 256 *.streamDeckPlugin > SHA256SUMS)
          node scripts/release-contract.mjs "$GITHUB_REF_NAME"
      - name: Notarize signed artifact (fail closed)
        env:
          APPLE_AC_API_KEY_P8: ${{ secrets.APPLE_AC_API_KEY_P8 }}
          APPLE_AC_KEY_ID: ${{ secrets.APPLE_AC_KEY_ID }}
          APPLE_AC_ISSUER: ${{ secrets.APPLE_AC_ISSUER }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_AC_API_KEY_P8" | base64 -d > "$key_path"
          APPLE_AC_API_KEY_P8="$key_path" node scripts/notarize-plugin.mjs dist/com.refactor-ia.nan.streamDeckPlugin
          rm -f "$key_path"
      - name: Re-verify notarized bytes and publish draft
        run: |
          printf '%s\n' '${{ github.token }}' | gh auth login --with-token
          node scripts/release-contract.mjs "$GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true" || { echo "refusing to replace assets on a published release"; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft
          fi
          plugin="$(basename dist/*.streamDeckPlugin)"
          node scripts/release-assets.mjs "$GITHUB_REF_NAME" clean "$plugin" SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" dist/*.streamDeckPlugin dist/SHA256SUMS --clobber
          node scripts/release-assets.mjs "$GITHUB_REF_NAME" exact "$plugin" SHA256SUMS"
